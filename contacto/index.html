      <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿En qué zonas trabajáis?","acceptedAnswer":{"@type":"Answer","text":"Tenemos sede en Cuenca y cubrimos eventos en toda España, desplazándonos allí donde nos necesitéis."}},{"@type":"Question","name":"¿Qué tipo de eventos cubrís?","acceptedAnswer":{"@type":"Answer","text":"Bodas, eventos corporativos, festivales, conciertos, graduaciones, inauguraciones y presentaciones, entre otros — cualquier evento que quieras que quede bien documentado."}},{"@type":"Question","name":"¿Qué servicios ofrecéis?","acceptedAnswer":{"@type":"Answer","text":"Cobertura de eventos, producción de vídeo, fotografía profesional y spots publicitarios, con edición propia incluida en todos los casos."}},{"@type":"Question","name":"¿Trabajáis con equipo propio?","acceptedAnswer":{"@type":"Answer","text":"Sí, siempre con equipo propio (cámaras Canon, Lumix y Sony, dron y estabilizadores) y sin intermediarios, de principio a fin."}},{"@type":"Question","name":"¿Cómo pido presupuesto?","acceptedAnswer":{"@type":"Answer","text":"Escríbenos a concafilms@gmail.com o por WhatsApp contándonos el evento (fecha, lugar y qué necesitas cubrir) y te respondemos con un presupuesto ajustado."}},{"@type":"Question","name":"¿Cuándo recibo el material?","acceptedAnswer":{"@type":"Answer","text":"Trabajamos con plazos de entrega marcados, que acordamos con cada cliente según el volumen del proyecto."}},{"@type":"Question","name":"¿Puedo ver trabajos anteriores?","acceptedAnswer":{"@type":"Answer","text":"Sí, en nuestro portfolio tenéis vídeos y fotografías de eventos, deportes, tradición y clubes que hemos cubierto."}},{"@type":"Question","name":"¿Quién forma el equipo de CONCA Films?","acceptedAnswer":{"@type":"Answer","text":"Pedro, Pablo y Juan. Un equipo de tres, con equipo propio (cámaras Canon, Lumix y Sony, dron y estabilizadores) y sin intermediarios."}},{"@type":"Question","name":"¿Podéis cubrir vídeo y fotografía a la vez en el mismo evento?","acceptedAnswer":{"@type":"Answer","text":"Sí, podemos combinar ambos servicios en la misma cobertura si el evento lo necesita."}},{"@type":"Question","name":"¿Tenéis experiencia con discotecas, clubes y sesiones de DJ?","acceptedAnswer":{"@type":"Answer","text":"Sí, cubrimos sesiones de DJ y vida nocturna, además de bodas, festivales, eventos corporativos y deportivos."}},{"@type":"Question","name":"¿Hacéis fotografía o vídeo deportivo?","acceptedAnswer":{"@type":"Answer","text":"Sí, cubrimos eventos deportivos como motociclismo, hípica y competiciones locales, entre otros."}},{"@type":"Question","name":"¿Grabáis spots publicitarios para marcas?","acceptedAnswer":{"@type":"Answer","text":"Sí, producimos spots publicitarios y contenido de marca, con rodaje y edición propios de principio a fin."}},{"@type":"Question","name":"¿Cómo es el proceso, desde que contacto hasta que recibo el material?","acceptedAnswer":{"@type":"Answer","text":"Nos escribes contándonos el evento (fecha, lugar y qué necesitas), te enviamos un presupuesto ajustado, cubrimos el evento con equipo propio y entregamos el material editado en el plazo acordado."}},{"@type":"Question","name":"¿Con cuánta antelación debo reservar la cobertura de mi evento?","acceptedAnswer":{"@type":"Answer","text":"Cuanto antes mejor, sobre todo en fechas de alta demanda (bodas, festivales, fin de curso). Escríbenos con tu fecha y te confirmamos disponibilidad."}},{"@type":"Question","name":"¿En qué formato entregáis el material?","acceptedAnswer":{"@type":"Answer","text":"Vídeo en alta calidad, listo para redes o proyección, y fotografías en alta resolución, ya editadas y seleccionadas."}},{"@type":"Question","name":"¿Usáis dron en las coberturas?","acceptedAnswer":{"@type":"Answer","text":"Sí, contamos con dron propio y lo incorporamos cuando el evento y la normativa del espacio lo permiten."}},{"@type":"Question","name":"¿Puedo pedir cambios en el montaje o en la selección final?","acceptedAnswer":{"@type":"Answer","text":"Sí, revisamos el resultado contigo y ajustamos lo necesario antes de la entrega final."}},{"@type":"Question","name":"¿Qué pasa si el evento se aplaza o se cancela?","acceptedAnswer":{"@type":"Answer","text":"Lo hablamos contigo caso por caso para reprogramar la cobertura sin problema."}}]}</script>
